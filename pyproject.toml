[project]
name = "cfe-forecast"
version = "0.1.0"
# Python 3.11 only, so the lock file holds one set of package versions and everyone gets
# the numbers stored in the notebooks. uv downloads 3.11 itself if it is not installed.
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",      # not imported directly: xgboost.XGBRegressor needs it
    "tensorflow>=2.21.0",
    "xgboost>=3.2.0",
]
