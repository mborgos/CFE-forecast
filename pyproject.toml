[project]
name = "cfe-forecast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.50.1",
    "entsoe-py>=0.8.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openelectricity>=0.12.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "xarray>=2026.9.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
]
